# Backend required for blur
backend = "glx";
vsync = true;

# Background blur
blur: {
  method = "dual_kawase";
  strength = 6;
}

# Blur only Kitty (remove rule to blur all transparent windows)
blur-background-exclude = [
  #"class_g != 'kitty' && class_g != 'i3bar' && class_g != 'Rofi'"
  "class_g != 'i3bar' && class_g != 'Rofi'"
];

# 80% opacity for Kitty (focused and unfocused)
opacity-rule = [
  #"90:class_g = 'kitty'"
];

