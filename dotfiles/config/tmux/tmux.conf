# setup plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'rose-pine/tmux'
#set -g @plugin 'tmux-plugins/tmux-continuum'

# setup session save-and-restore
#set -g @resurrect-capture-pane-contents 'on' # BUG WINDOW HEIGHT
set -g @continuum-save-interval '10'
#set -g @continuum-restore 'on'

# true color and opacity
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"

# my tmux low contrast theme

## panels
set -g window-style 'fg=#5e4747,bg=default'
set -g window-active-style 'fg=#9E7878,bg=default'

## status bar
set -g status-style 'fg=#5e4747,bg=default'
set -g status-left-style 'fg=#9e3c3c,bg=default,bold'
set -g status-right-style 'fg=#5e4747,bg=default'

## tabs
setw -g window-status-style 'fg=#5e4747,bg=default'
setw -g window-status-current-style 'fg=#9e3c3c,bg=default,bold'
setw -g window-status-activity-style 'fg=#9c8265,bg=default'

## borders
set -g pane-border-style 'fg=#171212,bg=default'
set -g pane-active-border-style 'fg=#5e4747,bg=default'

## system messages
set -g message-style 'fg=#c4a3a3,bg=#171212'
set -g message-command-style 'fg=#9E7878,bg=#171212'

## text selection
setw -g mode-style 'fg=#c4a3a3,bg=#3b1c1c'

## time
setw -g clock-mode-colour '#9e3c3c'


# base settings
set -s escape-time 0
set -g history-limit 250000
set -g display-time 4000
set -g status-interval 5
set -g base-index 1
set -g mouse on
setw -g pane-base-index 1

setw -g mode-keys vi
bind-key -T copy-mode-vi C-b send-keys -X page-up
bind-key -T copy-mode-vi C-f send-keys -X page-down

# setup key bindings
unbind C-b
set-option -g prefix C-q

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

bind-key -n M-c new-window
bind-key -n M-x kill-window
bind-key -n M-n next
bind-key -n M-p prev

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
